        function musicRefresh() {if (document.querySelector('.music-app')) renderMusic();}

        function musicProgress() {
            const seek = document.getElementById('mp-seek');
            if (!seek) return;
            const d = musicAudio.duration || 0, c = musicAudio.currentTime || 0;
            if (!musicSeeking) {seek.max = d || 1; seek.value = c;}
            seek.style.setProperty('--p', (d ? (c / d) * 100 : 0) + '%');
            document.getElementById('mp-cur').textContent = fmtTime(c);
            document.getElementById('mp-rem').textContent = '-' + fmtTime(d - c);
            if (d && 'mediaSession' in navigator && navigator.mediaSession.setPositionState) {
                try {navigator.mediaSession.setPositionState({duration: d, position: Math.min(c, d), playbackRate: 1});} catch (e) { }
            }
        }

        function musicSeekTo(v) {
            musicSeeking = true;
            musicAudio.currentTime = parseFloat(v);
            musicProgress();
        }

        function musicSetMedia() {
            if (!('mediaSession' in navigator) || musicIdx < 0) return;
            const t = musicTracks[musicIdx];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: t.title, artist: t.artist, album: t.album || '',
                artwork: t.cover ? [{src: t.cover}] : []
            });
        }

        function musicPlay(i) {
            if (i < 0 || i >= musicTracks.length) return;
            musicIdx = i;
            musicAudio.src = musicTracks[i].src;
            const pr = musicAudio.play();
            if (pr && pr.catch) pr.catch(e => {if (e.name === 'NotAllowedError') musicToast('แตะปุ่มเล่นอีกครั้ง');});
            musicSetMedia();
            musicRefresh();
        }

        function musicRowTap(i) {i === musicIdx ? musicToggle() : musicPlay(i);}

        function musicToggle() {
            if (musicIdx < 0) return musicPlay(0);

            else musicAudio.pause();
        }

        function musicPlayAll(shuffle) {
            musicShuffle = shuffle;
            musicPlay(shuffle ? Math.floor(Math.random() * musicTracks.length) : 0);
        }

        function musicNext(auto) {
            const n = musicTracks.length;
            if (!n) return;
            if (auto && musicRepeat === 'one') {musicAudio.currentTime = 0; musicAudio.play(); return;}
            let i;
            if (musicShuffle && n > 1) {do {i = Math.floor(Math.random() * n);} while (i === musicIdx);}
            else {
                i = musicIdx + 1;
                if (i >= n) {
                    if (auto && musicRepeat === 'off') {musicAudio.pause(); musicAudio.currentTime = 0; musicRefresh(); return;}
                    i = 0;
                }
            }
            musicPlay(i);
        }

        function musicPrev() {
            if (musicAudio.currentTime > 3) {musicAudio.currentTime = 0; return;}
            musicPlay((musicIdx - 1 + musicTracks.length) % musicTracks.length);
        }

                    '<button class="gl round">' + IC.trash + '</button></div>' +
                    homeIndicator;
                /* ===== ซูมรูป: บีบสองนิ้ว / ดับเบิลแตะ / ล้อเมาส์-แทร็คแพด + ลากเลื่อนตอนซูม ===== */
                const st = $('#pv-stage'), zimg = $('#pv-img');
                const Z = {s: 1, x: 0, y: 0}, MAXS = 5;
                const ptrs = new Map();
                let pinch = null, drag = null, x0 = null, moved = 0, tapT = 0, tapX = 0, tapY = 0, downT = 0;
                const phoneSc = () => {const ph = document.querySelector('.phone'); return ph ? (ph.getBoundingClientRect().width / ph.offsetWidth) || 1 : 1;};
                const zApply = anim => {
                    zimg.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.3,1)' : 'none';
                    zimg.style.transform = Z.s === 1 && !Z.x && !Z.y ? '' : 'translate(' + Z.x + 'px,' + Z.y + 'px) scale(' + Z.s + ')';
                };
                const zClamp = () => {
                    if (Z.s <= 1) {Z.x = Z.y = 0; return;}
                    const mx = Math.max(0, (zimg.offsetWidth * Z.s - st.clientWidth) / 2);
                    const my = Math.max(0, (zimg.offsetHeight * Z.s - st.clientHeight) / 2);
                    Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
                };
                const zAt = (ns, px, py) => {          /* ซูมโดยให้จุด (px,py) บนจอไม่ขยับ */
                    ns = Math.min(MAXS, Math.max(1, ns));
                    const sc = phoneSc(), r = zimg.getBoundingClientRect();
                    const c0x = r.left + r.width / 2 - Z.x * sc, c0y = r.top + r.height / 2 - Z.y * sc, k = ns / Z.s;
                    Z.x = ((px - c0x) - (px - c0x - Z.x * sc) * k) / sc;
                    Z.y = ((py - c0y) - (py - c0y - Z.y * sc) * k) / sc;
                    Z.s = ns; zClamp();
                };
                window.__pvReset = () => {Z.s = 1; Z.x = Z.y = 0; ptrs.clear(); pinch = drag = null; zimg.style.transition = 'none'; zimg.style.transform = '';};
                zimg.draggable = false;
                st.addEventListener('pointerdown', e => {
                    try {st.setPointerCapture(e.pointerId);} catch (_) { }
                    ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
                    if (ptrs.size === 1) {x0 = e.clientX; moved = 0; downT = Date.now(); drag = {x: e.clientX, y: e.clientY};}
                    if (ptrs.size === 2) {
                        const [a, b] = [...ptrs.values()];
                        pinch = {d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: Z.s}; drag = null;
                    }
                });
                st.addEventListener('pointermove', e => {
                    const p = ptrs.get(e.pointerId); if (!p) return;
                    const prevX = p.x, prevY = p.y; p.x = e.clientX; p.y = e.clientY;
                    moved = Math.max(moved, Math.hypot(e.clientX - (x0 === null ? e.clientX : x0), 0));
                    if (ptrs.size >= 2 && pinch) {
                        const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
                        zAt(pinch.s * d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); zApply(false);
                    } else if (drag && Z.s > 1) {
                        const sc = phoneSc(); Z.x += (e.clientX - prevX) / sc; Z.y += (e.clientY - prevY) / sc; zClamp(); zApply(false);
                    }
                });
                const pEnd = e => {
                    const had = ptrs.has(e.pointerId); ptrs.delete(e.pointerId);
                    if (!had) return;
                    if (pinch && ptrs.size < 2) {pinch = null; if (Z.s < 1.05) {Z.s = 1; Z.x = Z.y = 0; zApply(true);} drag = null; if (ptrs.size === 1) {const q = [...ptrs.values()][0]; drag = {x: q.x, y: q.y}; x0 = null;} return;}
                    if (ptrs.size) return;
                    const dx = e.clientX - (x0 === null ? e.clientX : x0), dy = drag ? e.clientY - drag.y : 0; drag = null;
                    const isTap = Date.now() - downT < 300 && Math.abs(dx) < 8 && Math.abs(dy) < 8;
                    if (isTap) {
                        const now = Date.now();
                        if (now - tapT < 320 && Math.hypot(e.clientX - tapX, e.clientY - tapY) < 30) {   /* ดับเบิลแตะ */
                            tapT = 0;
                            if (Z.s > 1.05) {Z.s = 1; Z.x = Z.y = 0;} else zAt(2.6, e.clientX, e.clientY);
                            zApply(true);
                        } else {tapT = now; tapX = e.clientX; tapY = e.clientY;}
                    } else if (Z.s <= 1.02 && x0 !== null) {

                    }
                    x0 = null;
                };
                st.addEventListener('pointerup', pEnd);
                st.addEventListener('pointercancel', pEnd);
                st.addEventListener('wheel', e => {          /* เมาส์/แทร็คแพด: ซูมเข้า-ออกที่ตำแหน่งเคอร์เซอร์ */
                    e.preventDefault();

                }, {passive: false});

            /* ---------- Layouts ---------- */
            const SYM = ['1234567890', '-/:;()$&@"', ".,?!'"];

            const HASH = ['[]{}#%^*+=', '_\\|~<>$€¥•', ".,?!'"];          // ชั้น #+=
            const KANA = [
                ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ'],
                ['い', 'き', 'し', 'ち', 'に', 'ひ', 'み', '', 'り', ''],

                ['お', 'こ', 'そ', 'と', 'の', 'ほ', 'も', 'よ', 'ろ', 'を']
            ];
            const LAYOUT = {
                en: {name: 'English', abc: 'ABC', base: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm']},
                ko: {
                    name: '한국어', abc: 'ㄱ', base: ['ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ', 'ㅋㅌㅊㅍㅠㅜㅡ'],
                    shift: ['ㅃㅉㄸㄲㅆㅛㅕㅑㅒㅖ', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ', 'ㅋㅌㅊㅍㅠㅜㅡ']
                },
                th: {
                    name: '', abc: 'ก', base: ['ๅ/_ภถุึคตจขช', 'ๆไำพะัีรนยบล', 'ฟหกดเ้่าสวงฃ', 'ผปแอิืทมใฝ'],
                    shift: ['+๑๒๓๔ู฿๕๖๗๘๙', '๐"ฎฑธํ๊ณฯญฐ,', 'ฤฆฏโฌ็๋ษศซ.ฅ', '()ฉฮฺ์?ฒฬฦ']
                },
                ja: {name: '日本語', abc: 'あ', base: []}
            };
            LAYOUT.en.shift = LAYOUT.en.base.map(r => r.toUpperCase());

            const rowsOf = (lang, layer) => layer === 'sym' ? (lang === 'th' ? SYM_TH : SYM) : (layer === 'hash' ? HASH : (layer === 'shift' ? LAYOUT[lang].shift : LAYOUT[lang].base));
            function layerOf(lang, c) {
                for (const ly of ['base', 'shift', 'sym', 'hash'])
                    if (lang !== 'ja' && rowsOf(lang, ly).some(r => Array.from(r).includes(c))) return ly;
                return null;
            }

            /* ---------- Hangul composition ---------- */
            const L = Array.from('ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ');
            const V = Array.from('ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ');
            const T = ['', ...Array.from('ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ')];
            const VSPLIT = {'ㅘ': ['ㅗ', 'ㅏ'], 'ㅙ': ['ㅗ', 'ㅐ'], 'ㅚ': ['ㅗ', 'ㅣ'], 'ㅝ': ['ㅜ', 'ㅓ'], 'ㅞ': ['ㅜ', 'ㅔ'], 'ㅟ': ['ㅜ', 'ㅣ'], 'ㅢ': ['ㅡ', 'ㅣ']};
            const TSPLIT = {'ㄳ': ['ㄱ', 'ㅅ'], 'ㄵ': ['ㄴ', 'ㅈ'], 'ㄶ': ['ㄴ', 'ㅎ'], 'ㄺ': ['ㄹ', 'ㄱ'], 'ㄻ': ['ㄹ', 'ㅁ'], 'ㄼ': ['ㄹ', 'ㅂ'], 'ㄽ': ['ㄹ', 'ㅅ'], 'ㄾ': ['ㄹ', 'ㅌ'], 'ㄿ': ['ㄹ', 'ㅍ'], 'ㅀ': ['ㄹ', 'ㅎ'], 'ㅄ': ['ㅂ', 'ㅅ']};
            const comp = (l, v, t) => String.fromCharCode(0xAC00 + (l * 21 + v) * 28 + t);
            const SMALL = {'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ'};
            const KANA_SET = new Set([].concat(...KANA).filter(Boolean));
            const JA_FN = ['゛', '゜', '小', 'ー', '、', '。', '!', '?'];

            function plan(text, lang) {
                const steps = [];
                let out = '';
                const add = (s) => {steps.push(s); out = s.disp;};
                for (const c of Array.from(text)) {
                    if (c === ' ') {add({key: 'space', fn: true, disp: out + ' '}); continue;}
                    const code = c.charCodeAt(0);
                    if (lang === 'ko' && code >= 0xAC00 && code <= 0xD7A3) {
                        const n = code - 0xAC00, t = n % 28, v = Math.floor(n / 28) % 21, l = Math.floor(n / 588), pre = out;
                        add({key: L[l], layer: layerOf('ko', L[l]), disp: pre + L[l]});
                        const vs = VSPLIT[V[v]];
                        if (vs) {add({key: vs[0], layer: 'base', disp: pre + comp(l, V.indexOf(vs[0]), 0)}); add({key: vs[1], layer: 'base', disp: pre + comp(l, v, 0)});}
                        else add({key: V[v], layer: layerOf('ko', V[v]), disp: pre + comp(l, v, 0)});
                        if (t) {
                            const ts = TSPLIT[T[t]];
                            if (ts) {add({key: ts[0], layer: layerOf('ko', ts[0]), disp: pre + comp(l, v, T.indexOf(ts[0]))}); add({key: ts[1], layer: layerOf('ko', ts[1]), disp: pre + comp(l, v, t)});}
                            else add({key: T[t], layer: layerOf('ko', T[t]), disp: pre + comp(l, v, t)});
                        }
                        continue;
                    }
                    if (lang === 'ja') {
                        const pre = out;
                        if (SMALL[c]) {add({key: SMALL[c], disp: pre + SMALL[c]}); add({key: '小', fn: true, disp: pre + c}); continue;}
                        const nfd = c.normalize('NFD');
                        if (nfd.length === 2 && KANA_SET.has(nfd[0])) {
                            add({key: nfd[0], disp: pre + nfd[0]});
                            add({key: nfd[1] === '\u3099' ? '゛' : '゜', fn: true, disp: pre + c});
                            continue;
                        }
                        if (KANA_SET.has(c) || JA_FN.includes(c)) {add({key: c, fn: JA_FN.includes(c), disp: pre + c}); continue;}
                        add({direct: true, disp: pre + c});
                        continue;
                    }
                    if (lang === 'en' && (c === '’' || c === '‘')) {add({key: "'", layer: 'sym', disp: out + c}); continue;}   // ’ พิมพ์ด้วยปุ่ม '
                    const ly = layerOf(lang, c);
                    if (ly) add({key: c, layer: ly, disp: out + c});
                    else add({direct: true, disp: out + c});
                }
                return steps;
            }

            window.__KB = {plan, LAYOUT, SYM, HASH, KANA, JA_FN, layerOf};

            /* ---------- Attach to chat detail screen ---------- */
            const state = {};   // { [chatKey]: { node, busy } }

            const uiLang = () => {const l = document.documentElement.lang; return (l === 'en' || l === 'ko') ? l : 'th';};
            function syncLang() {

            /* ปุ่มสระ/วรรณยุกต์ไทย: iOS ใส่วงกลมประให้เองเมื่อเครื่องหมายไม่มีพยัญชนะ → วาดลง canvas ด้วยฟอนต์ของเครื่อง
               โดยใช้ "ก" เป็นฐาน แล้วลบหัว ก ออก เหลือเฉพาะเครื่องหมายที่อยู่ตำแหน่งถูกต้อง ใช้เป็นรูปบนปุ่ม */
            const MK_CACHE = {};
            function markImg(ch) {
                if (ch in MK_CACHE) return MK_CACHE[ch];
                let res = null;
                try {
                    const W = 160, H = 160, FS = 84, BASE = 'ก';
                    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
                    const g = cv.getContext('2d');
                    /* ใช้ฟอนต์ตระกูลเดียวกับตัวอักษรบนปุ่ม + น้ำหนัก 400 เท่ากัน เพื่อให้เส้นบางเท่ากัน (เดิมบังคับ Thonburi ทำให้หนากว่า) */
                    let fam = ''; try {const kk = document.querySelector('.ikb-key') || document.body; fam = getComputedStyle(kk).fontFamily;} catch (e) { }
                    g.font = '400 ' + FS + 'px ' + (fam ? fam + ',' : '') + '"Sukhumvit Set","Noto Sans Thai",sans-serif';
                    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#000'; g.strokeStyle = '#000';
                    g.fillText(BASE + ch, W / 2, 112);
                    g.globalCompositeOperation = 'destination-out';
                    g.fillText(BASE, W / 2, 112);
                    g.lineWidth = 3; g.lineJoin = 'round'; g.strokeText(BASE, W / 2, 112);      // ลบขอบที่เหลือของ ก
                    const d = g.getImageData(0, 0, W, H).data;
                    let x0 = W, y0 = H, x1 = -1, y1 = -1;
                    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 24) {if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;}
                    if (x1 >= 0) {
                        const w = x1 - x0 + 1, h = y1 - y0 + 1, out = document.createElement('canvas'); out.width = w; out.height = h;
                        out.getContext('2d').drawImage(cv, x0, y0, w, h, 0, 0, w, h);
                        const k = 22 / FS * 1.15 / 1.35;    // ขนาดเครื่องหมายใกล้เคียงตัวอักษรบนปุ่ม (แป้นไทย 22px)                                    // สเกลให้เครื่องหมายใหญ่เท่าตัวอักษร ~26px

            const thSymKey = (ch, cls, k) => {
                const g = TH_GLYPH_Y[ch];
                if (!g) return mk(ch, cls, k);
                return '<div class="ikb-key ' + (cls ? cls + ' ' : '') + 'g" data-k="' + E(k !== undefined ? k : ch) + '" data-l="' + (cls ? '' : E(ch)) + '"><img alt="" draggable="false" src="data:image/png;base64,' + g[0] +
                    '" style="left:' + g[1] + '%;--t:' + g[2] + ';width:' + g[3] + '%"></div>';
            };

            function kbRender(lang, layer) {
                cur.lang = lang; cur.layer = layer;
                const kb = cur.kb;
                const symL = layer === 'sym' || layer === 'hash';
                kb.className = 'ikb ' + lang + (lang === 'th' && !symL ? ' thk' : '') + (symL ? ' sy' : '');
                const isTh = lang === 'th';
                const styled = lang !== 'ja';   // th / en / ko ใช้ชุดปุ่มและไอคอนแบบเดียวกัน
                let h = '';
                if (lang === 'ja') {
                    KANA.forEach(r => {h += '<div class="ikb-row">' + r.map(c => c ? mk(c) : '<div class="ikb-key sp"></div>').join('') + '</div>';});
                    h += '<div class="ikb-row">' + JA_FN.slice(0, 4).map(c => mk(c, 'fn')).join('') +
                        mk(LAYOUT.ja.name, 'space', 'space') + mk('⌫', 'fn', 'back') + mk('ส่ง', 'send', 'send') + '</div>';
                } else {
                    const rows = rowsOf(lang, layer);
                    rows.forEach((r, i) => {
                        const chars = Array.from(r);
                        const last = i === rows.length - 1;
                        const pad = !last && chars.length < Array.from(rows[0]).length - (isTh ? 1 : 0);
                        h += '<div class="ikb-row' + (pad ? ' pad' : '') + (last && symL ? ' sy3' : '') + '">' +
                            (last ? (symL ? thSymKey(layer === 'sym' ? '#+=' : '123', 'fn', layer === 'sym' ? 'hash' : 'sym') : (styled ? thFn(TH_IC.shift, layer === 'shift' ? 'on' : '', 'shift') : mk('⇧', 'fn' + (layer === 'shift' ? ' on' : ''), 'shift'))) : '') +
                            chars.map(c => (symL && TH_GLYPH_Y[c]) ? thSymKey(c) : (isTh && (layer === 'base' || layer === 'shift') && (layer === 'shift' ? TH_GLYPH_S : TH_GLYPH)[c]) ? thGlyph(c, layer) : mk(c)).join('') +
                            (last ? (styled ? thFn(TH_IC.back, '', 'back') : mk('⌫', 'fn', 'back')) : '') + '</div>';
                    });
                    h += '<div class="ikb-row bottom">' +
                        (symL ? (isTh ? thSymKey('กขค', 'fn', 'abc') : mk(LAYOUT[lang].abc, 'fn', 'abc')) : mk('123', 'fn', 'sym')) +
                        (styled ? thFn(TH_IC.emoji, '', 'globe') : mk('🌐', 'fn', 'globe')) + mk(isTh || styled ? '' : LAYOUT[lang].name, 'space', 'space') +
                        (styled ? '<div class="ikb-key send ret" data-k="send" data-l="">' + TH_IC.ret + '</div>' : mk('ส่ง', 'send', 'send')) + '</div>';
                }
                if (styled) h += thFoot();
                kb.innerHTML = h;
            }

            async function tapKey(id) {
                if (!cur) return;
                const el = Array.from(cur.kb.querySelectorAll('.ikb-key')).find(e => e.dataset.k === id);
                if (!el) return;
                el.classList.add('down');
                if (alive() && id !== 'send') sfx(id === 'back' ? 'keyDel' : (id.length > 1 ? 'keyMod' : 'key'));
                await sleep(rand(80, 115));
                el.classList.remove('down');
            }

            async function ensureLayer(layer) {
                if (!layer || cur.lang === 'ja' || cur.layer === layer) return;
                const inSym = cur.layer === 'sym' || cur.layer === 'hash';
                if (layer === 'hash') {
                    if (!inSym) {await tapKey('sym'); kbRender(cur.lang, 'sym'); await sleep(70);}
                    await tapKey('hash'); kbRender(cur.lang, 'hash');
                } else if (layer === 'sym') {await tapKey('sym'); kbRender(cur.lang, 'sym');}
                else if (layer === 'shift') {
                    if (inSym) {await tapKey('abc'); kbRender(cur.lang, 'base'); await sleep(70);}
                    await tapKey('shift'); kbRender(cur.lang, 'shift');
                }
                else if (layer === 'base') {await tapKey('abc'); kbRender(cur.lang, 'base');}
                await sleep(70);
            }

            function setValue(v) {
                cur.field.value = v;
                cur.field.scrollLeft = cur.field.scrollWidth;
                cur.scr.classList.toggle('has-text', v.length > 0);
            }

            async function typeText(text, lang) {
                if (cur.lang !== lang) {await tapKey('globe'); await sleep(120); kbRender(lang, 'base'); await sleep(260);}
                for (const st of plan(text, lang)) {
                    if (!cur || !alive()) return;          // ออกจากห้องแล้ว → เลิกกดแป้น (ข้อความยังถูกส่งต่อเบื้องหลัง)
                    if (st.direct) {sfx('key'); setValue(st.disp); await sleep(120); continue;}
                    if (st.fn) {
                        if (cur.layer !== 'base' && cur.lang !== 'ja' && st.key === 'space') { /* space works in any layer */}
                        await tapKey(st.key);
                    } else {
                        await ensureLayer(st.layer);
                        await tapKey(st.key);
                        if (st.layer === 'shift') kbRender(cur.lang, 'base');   // auto-unshift
                    }
                    setValue(st.disp);
                    await sleep(rand(60, 120));
                }
            }

            /* ---------- bubbles ---------- */
            /* alive = กำลังเปิดหน้าแชทอยู่จริง (ไม่ใช่แค่ DOM ค้างอยู่ตอนปิดหน้าแล้ว) */
            const alive = () => !!cur && document.body.contains(cur.area) && !!$(cur.ig ? '#instagram-screen.active' : (cur.kk ? '#app-screen.active' : '#chat-detail-screen.active'));
            const viewing = key => alive() && cur.key === key;
            const sfx = (n, ...a) => {try {if (window.SFX && SFX[n]) SFX[n](...a);} catch (e) { } };

            /* ริคุตอบตอนเราไม่ได้อยู่ในห้องแชท → เพิ่ม badge + เสียงแจ้งเตือน */
            function notifyAway(key, text) {
                if (key === 'ig_riku') {try {window.__igNotifyAway(text);} catch (e) { } return;}
                appBadges.messages = (appBadges.messages || 0) + 1;
                try {renderHomeAndDock();} catch (e) { }
                document.querySelectorAll('#app-grid .badge, #dock .badge').forEach(b => b.classList.add('badge-pop'));
                if ($('#app-screen.active .m-row')) {            // อยู่หน้ารายการข้อความ → รีเฟรชให้เห็นพรีวิว + จุดฟ้า
                    try {window.openApp('messages', 'Messages');} catch (e) { }
                }
                if (window.showMsgBanner && !$('#app-screen.active .m-row')) showMsgBanner(key);   // อยู่หน้าอื่น → แบนเนอร์เด้งจากด้านบน
                sfx('notify');
            }
            /* Kakao: เลื่อนลงสุดแบบทันที (ไม่ smooth) แล้วตรึงไว้ต่อเนื่องสั้นๆ — แบบ smooth ทำให้บับเบิลใหม่โผล่ใต้แป้นก่อนค่อยไต่ขึ้นมา
               และตอนแป้นเลื่อนขึ้น padding ค่อยๆ ขยายใน .34s ทำให้ปลายทางที่คำนวณไว้เร็วเกินไปจนบับเบิลล่างสุดโดนแป้นบัง */
            const pinEnd = (ms) => {
                const a = cur && cur.area; if (!a) return;
                const t0 = performance.now();
                const step = () => {
                    if (!alive() || cur.area !== a) return;
                    a.scrollTop = a.scrollHeight;
                    if (performance.now() - t0 < ms) requestAnimationFrame(step);
                };
                step();
            };
            const scrollEnd = () => {
                if (!alive()) return;
                if (cur.kk) {pinEnd(cur.scr.classList.contains('kb-on') ? 420 : 120); return;}
                cur.area.scrollTo({top: cur.area.scrollHeight, behavior: 'smooth'});
            };

            function addBubble(dir, text, html) {
                if (!alive()) return;
                if (cur.ig) {igRefresh(true); scrollEnd(); return;}
                const area = cur.area;
                area.querySelectorAll('.cd-deliv, .cd-line.typing').forEach(e => e.remove());
                const lines = area.querySelectorAll('.cd-line');
                const prev = lines[lines.length - 1];
                const same = prev && prev.classList.contains(dir);
                if (same) prev.querySelector('.b').classList.remove('last');
                const line = document.createElement('div');
                line.className = 'cd-line ' + dir + (same ? '' : ' first') + ' pop';
                line.innerHTML = '<div class="b ' + dir + ' last">' + (html || E(text)) + '</div>';
                area.appendChild(line);
                scrollEnd();
            }
            function addTyping() {
                if (!alive()) return;
                if (cur.kk) {
                    cur.area.querySelectorAll('.kk-l.typing').forEach(e => e.remove());
                    cur.area.insertAdjacentHTML('beforeend', '<div class="kk-l first typing"><div class="kk-av2"><img src="' + KK_AV_SRC + '" alt=""></div><div class="kk-col"><div class="kk-sender">' + E(KK_NAME) + '</div><div class="kk-wrap"><div class="kk-b l kk-tp"><i></i><i></i><i></i></div></div></div></div>');
                    scrollEnd();
                    return;
                }
                if (cur.ig) {
                    cur.area.querySelectorAll('.dm-m.typing').forEach(e => e.remove());
                    const c = window.__igChat && window.__igChat();
                    const av = c && c.avatar ? '<img src="' + E(c.avatar) + '" alt="">' : '';
                    cur.area.insertAdjacentHTML('beforeend', '<div class="dm-m in gs typing"><span class="dm-mav">' + av + '</span><div class="dm-b in tp"><i></i><i></i><i></i></div></div>');
                    scrollEnd();
                    return;
                }
                cur.area.querySelectorAll('.cd-line.typing').forEach(e => e.remove());
                const line = document.createElement('div');
                line.className = 'cd-line first typing pop';
                line.innerHTML = '<div class="b in last tp"><i></i><i></i><i></i></div>';
                cur.area.appendChild(line);
                scrollEnd();
            }
            function deliver() {
                if (!alive()) return;
                if (cur.ig) return;     /* ห้อง DM ไอจีมีข้อความ "เห็นแล้ว" ต่อท้ายให้อยู่แล้ว */
                const d = document.createElement('div');
                d.className = 'cd-deliv'; d.textContent = 'ส่งแล้ว';
                cur.area.appendChild(d);
                scrollEnd();
            }

            function pushData(key, type, text) {
                if (key === 'ig_riku') {
                    const ic = window.__igChat && window.__igChat(); if (!ic) return;
                    ic.messages.push({type, text}); ic.time = 'now'; ic.activityAt = Date.now();
                    return;
                }
                const c = chatDataMessages[key];
                c.messages.push({type, text});
                c.preview = text;
                const n = new Date();
                c.time = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
            }

            /* ---------- choices ---------- */
            function hideTray() {if (cur && cur.tray) {cur.tray.classList.remove('show');} }

            function showChoices() {
                if (!alive()) return;
                const st = state[cur.key];
                const node = CHAT_SCRIPTS[cur.key].nodes[st.node];
                const tray = cur.tray;
                
                hideTray(); setTimeout(kbClose, 400); return;

                if (!st.busy && (!node || !node.choices || !node.choices.length)) {hideTray(); setTimeout(kbClose, 400); return;}
                if (st.busy || !cur.scr.classList.contains('kb-on')) {hideTray(); return;}
                tray.innerHTML = node.choices.map((c, i) =>
                    '<button class="kb-choice" data-i="' + i + '" style="--n:' + i + '"><span>' + E(c.text) + '</span></button>').join('');
                tray.querySelectorAll('.kb-choice').forEach(b => b.onclick = e => {e.stopPropagation(); choose(+b.dataset.i);});
                cur.scr.style.setProperty('--trayh', tray.offsetHeight + 'px');
                cur.area.scrollTop = cur.area.scrollHeight;            
                requestAnimationFrame(() => {
                    if (!alive()) return;
                    cur.area.scrollTop = cur.area.scrollHeight;
                    tray.classList.add('show');                        
                });
            }

            async function choose(i) {
                const key = cur.key, st = state[key];
                if (st.busy) return;
                const choice = CHAT_SCRIPTS[key].nodes[st.node].choices[i];
                if (!choice) return;
                /* พิมพ์ข้อความตามที่ช้อยส์แสดงอยู่จริง (แปลแล้ว) ด้วยแป้นของภาษานั้น */
                const shownEl = cur.tray.querySelector('.kb-choice[data-i="' + i + '"] span');
                const shown = (shownEl && shownEl.textContent.trim()) || choice.text;
                let kl = choice.lang || uiLang();
                if (!choice.lang && kl !== 'th' && /[฀-๿]/.test(shown)) kl = 'th';   // ยังไม่มีคำแปล → ยังเป็นไทย ใช้แป้นไทย
                st.busy = true; st.running = true;
                try {
                    hideTray();
                    cur.scr.style.setProperty('--trayh', '0px');
                    await typeText(shown, kl);
                    if (viewing(key)) {
                        await sleep(240);
                        await tapKey('send');
                        setValue('');
                        sfx('send');
                    }
                    pushData(key, 'outgoing', choice.text);
                    if (key === 'ig_riku' && /^mc[123]$/.test(st.node) && window.__rkPromise) window.__rkPromise(+st.node.slice(2));   /* ตอบว่าจะโทรไปง้อ → ปลดล็อกบทโทรออกง้อริคุ */
                    addBubble('out', choice.text);
                    deliver();
                    const rep = choice.replies[Math.floor(Math.random() * choice.replies.length)];
                    await sleep(rand(700, 1100));
                    for (const m of rep.msgs) {
                        st.typing = true;
                        addTyping();
                        await sleep(rand(800, 1200) + m.length * 20);
                        st.typing = false;
                        pushData(key, 'incoming', m);
                        if (viewing(key)) {addBubble('in', m); sfx('receive');}   // อยู่ในห้อง → เสียงรับข้อความ
                        else notifyAway(key, m);                                        // ออกไปแล้ว → badge + เสียงแจ้งเตือน
                        await sleep(260);
                    }
                    st.node = rep.next !== undefined ? rep.next : (choice.next !== undefined ? choice.next : null);
                    await sleep(900 + Math.min(2600, rep.msgs.join('').length * 45));   // เวลาอ่านคำตอบ
                } finally {
                    st.typing = false; st.busy = false; st.running = false;
                }
                if (viewing(key)) showChoices();
            }

            function kbOpen() {
                if (!alive()) return;
                if (cur.kk) {   /* Kakao: เปิดแป้นเฉพาะตอนยังมีข้อความรอพิมพ์ และริคุไม่ได้กำลังตอบอยู่ */
                    if (kkSt.busy || !KK_SCRIPT[kkSt.i]) return;
                    syncLang();
                    cur.scr.classList.add('kb-on');
                    pinEnd(420);   // padding ขยายระหว่างแป้นเลื่อนขึ้น → ตรึงที่ล่างสุดตลอด ไม่ให้บับเบิลสุดท้ายจมใต้แป้น
                    return;
                }
                if (cur.ig) {   /* DM ไอจี: ยังไม่มีช้อยส์ให้ตอบ (ยังไม่ได้รีแอคสตอรี่ / บทสนทนาจบแล้ว) → ไม่เปิดแป้น */
                    const st0 = state[cur.key], n0 = CHAT_SCRIPTS[cur.key].nodes[st0.node];
                    if (!st0.busy && (!n0 || !n0.choices || !n0.choices.length)) return;
                }
                syncLang();
                cur.scr.classList.add('kb-on');
                setTimeout(showChoices, 220);
            }
            function kbClose() {
                if (!cur || !cur.scr.classList.contains('kb-on') || state[cur.key].busy) return;
                cur.scr.classList.remove('kb-on');
                cur.scr.style.setProperty('--trayh', '0px');
                hideTray();
            }

            function attach(key) {
                const scr = $('#chat-detail-screen');
                const area = $('#cd-area');
                const field = $('.cd-field input', scr);
                if (!scr || !area || !field) return;
                state[key] = state[key] || {node: CHAT_SCRIPTS[key].start, busy: false};
                state[key].busy = !!state[key].running;   // ถ้าริคุยังตอบอยู่เบื้องหลัง ให้รอจนจบก่อน
                scr.classList.remove('kb-on', 'has-text');
                scr.style.setProperty('--trayh', '0px');
                field.readOnly = true;
                field.setAttribute('inputmode', 'none');
                const mic = $('.cd-field svg', scr);
                if (mic) mic.classList.add('mic');
                const sendBtn = document.createElement('span');
                sendBtn.className = 'kb-sendbtn';
                sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
                $('.cd-field', scr).appendChild(sendBtn);
                const tray = document.createElement('div'); tray.className = 'kb-tray';
                const kb = document.createElement('div'); kb.className = 'ikb ' + uiLang();
                scr.appendChild(tray); scr.appendChild(kb);
                cur = {key, scr, area, field, kb, tray, lang: uiLang(), layer: 'base'};
                kbRender(cur.lang, 'base');
                $('.cd-field', scr).addEventListener('click', kbOpen);
                area.addEventListener('click', kbClose);
                const sc = $('#chat-detail-screen .cd-area'); if (sc) sc.scrollTop = sc.scrollHeight;
                if (state[key].typing) addTyping();      // กลับมาตอนริคุกำลังพิมพ์อยู่ → โชว์จุด ... ต่อ
            }

            /* ---------- DM ไอจีของริคุ: ใช้ engine เดียวกับแอปข้อความ ---------- */
            function igRefresh(pop) {
                const c = window.__igChat && window.__igChat(); if (!c || !cur || !cur.area) return;
                const area = cur.area;
                Array.from(area.children).forEach(n => {if (!n.classList.contains('dm-intro')) n.remove();});
                area.insertAdjacentHTML('beforeend', window.__igBodyHtml(c));
                if (pop) {const ms = area.querySelectorAll('.dm-m'); const l = ms[ms.length - 1]; if (l) l.classList.add('pop');}
            }
            function attachIg() {
                const key = 'ig_riku';
                const scr = $('#instagram-screen .ios-app.ig-dm-app'), area = $('#ig-dm-messages');
                const pill = scr && $('.dm-pill', scr), ph = pill && $('.dm-ph', pill);
                if (!scr || !area || !pill || !ph) {cur = null; return;}
                state[key] = state[key] || {node: CHAT_SCRIPTS[key].start, busy: false};
                state[key].busy = !!state[key].running;
                const field = document.createElement('input');
                field.className = 'dm-fi'; field.readOnly = true; field.setAttribute('inputmode', 'none');
                field.setAttribute('autocomplete', 'off'); field.placeholder = ph.textContent.trim();
                ph.replaceWith(field);
                const sendTxt = document.createElement('span'); sendTxt.className = 'dm-sendtxt'; sendTxt.textContent = 'ส่ง';
                pill.insertBefore(sendTxt, $('.dm-tools', pill));
                const tray = document.createElement('div'); tray.className = 'kb-tray';
                const kb = document.createElement('div'); kb.className = 'ikb ' + uiLang();
                scr.classList.add('kb-ig'); scr.style.setProperty('--trayh', '0px');
                scr.appendChild(tray); scr.appendChild(kb);
                cur = {key, scr, area, field, kb, tray, ig: true, lang: uiLang(), layer: 'base'};
                kbRender(cur.lang, 'base');
                pill.addEventListener('click', kbOpen);
                area.addEventListener('click', kbClose);
                if (state[key].typing) addTyping();
            }

            /* =====================================================================
               KakaoTalk — ห้อง "เจ้าหญิง": โต้ตอบทางเดียว ไม่มีช้อยส์
               แตะช่องข้อความ → แป้นพิมพ์ขึ้น → แตะที่แป้น → พิมพ์ข้อความที่กำหนดไว้ให้เองทีละตัว → ส่ง → ริคุตอบ
               แก้เนื้อเรื่องที่ KK_SCRIPT ด้านล่าง: me = ข้อความที่ชิอนพิมพ์ (ใส่เป็น array = ส่งต่อเนื่องหลายข้อความ), replies = ที่ริคุตอบ

            const kkSt = {i: 0, busy: false, typing: false};
            state[KK_KEY] = kkSt;

            function kkNextTime() {
                let last = '21:00';
                for (let i = kakaoMessages.length - 1; i >= 0; i--) {if (kakaoMessages[i].time) {last = kakaoMessages[i].time; break;} }
                const p = last.split(':'); let m = (+p[0]) * 60 + (+p[1]) + 1;
                m %= 1440;
                return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
            }

            function kkBubblesHtml() {
                const msgs = kakaoMessages;
                let h = '';
                msgs.forEach((m, i) => {
                    if (m.type === 'date') {h += '<div class="kk-date"><span>' + E(m.text) + '</span></div>'; return;}
                    const prev = msgs[i - 1], next = msgs[i + 1];
                    const first = !prev || prev.type === 'date' || prev.sender !== m.sender;
                    const showTime = !next || next.type === 'date' || next.sender !== m.sender || next.time !== m.time;
                    const text = E(m.text).replace(/\n/g, '<br>');
                    const time = showTime ? '<span class="kk-t">' + E(m.time) + '</span>' : '';
                    if (m.sender !== 'sion') {
                        h += '<div class="kk-l' + (first ? ' first' : '') + '">' +
                            (first ? '<div class="kk-av2"><img src="' + KK_AV_SRC + '" alt=""></div>' : '<div class="kk-spacer"></div>') +
                            '<div class="kk-col">' + (first ? '<div class="kk-sender">' + E(KK_NAME) + '</div>' : '') +
                            '<div class="kk-wrap"><div class="kk-b l">' + text + '</div>' + time + '</div></div></div>';
                    } else {
                        const meta = (m.unread ? '<span class="kk-n">1</span>' : '') + time;
                        h += '<div class="kk-r' + (first ? ' first' : '') + '">' + (meta ? '<div class="kk-meta">' + meta + '</div>' : '') + '<div class="kk-b r">' + text + '</div></div>';
                    }
                });
                return h;
            }
            function kkRefresh(pop) {
                if (!alive() || !cur.kk) return;
                cur.area.innerHTML = kkBubblesHtml();
                if (pop) {const ls = cur.area.querySelectorAll('.kk-l, .kk-r'); const l = ls[ls.length - 1]; if (l) l.classList.add('kk-pop');}
                scrollEnd();
            }

            /* ข้อความที่แสดงอยู่จริงหลังแปล (ระบบ i18n แปลจาก DOM) — ใช้พิมพ์ด้วยแป้นของภาษานั้น */
            async function kkShown(text) {
                if (uiLang() === 'th' || !cur || !cur.scr) return text;
                const probe = document.createElement('span');
                probe.style.cssText = 'position:absolute;left:-9999px;top:0;opacity:0;pointer-events:none';
                probe.textContent = text;
                cur.scr.appendChild(probe);
                await sleep(70);
                const shown = probe.textContent.trim() || text;
                probe.remove();
                return shown;
            }

            function kkAway(text) {   /* ริคุตอบตอนเราออกจากห้องไปแล้ว → badge + เสียงแจ้งเตือน */
                appBadges.kakaotalk = (appBadges.kakaotalk || 0) + 1;
                try {renderHomeAndDock();} catch (e) { }
                sfx('notify');
                try {window.showKkBanner(KK_NAME, text);} catch (e) { }
            }

            async function kkRun() {
                if (kkSt.busy || !cur || !cur.kk) return;
                const beat = KK_SCRIPT[kkSt.i];
                if (!beat) return;
                kkSt.busy = true;
                try {
                    const parts = Array.isArray(beat.me) ? beat.me : [beat.me];
                    for (const text of parts) {
                        const shown = await kkShown(text);
                        let kl = uiLang();
                        if (kl !== 'th' && /[฀-๿]/.test(shown)) kl = 'th';   // ยังไม่มีคำแปล → ใช้แป้นไทย
                        await typeText(shown, kl);
                        if (viewing(KK_KEY)) {await sleep(240); await tapKey('send'); setValue(''); sfx('send');}
                        kakaoMessages.push({sender: 'sion', text, time: kkNextTime(), unread: !beat.read});
                        if (viewing(KK_KEY)) kkRefresh(true);
                        await sleep(rand(450, 750));
                    }
                    await sleep(rand(500, 800));
                    if (!beat.read && (beat.replies || []).length) {   // ริคุเปิดอ่าน → เลข 1 หาย
                        await sleep(rand(900, 1800));
                        kakaoMessages.forEach(m => {if (m.unread) m.unread = false;});
                        if (viewing(KK_KEY)) kkRefresh(false);
                        await sleep(rand(400, 800));
                    }
                    for (const r of (beat.replies || [])) {
                        kkSt.typing = true;
                        addTyping();
                        await sleep(rand(800, 1200) + r.length * 20);
                        kkSt.typing = false;
                        kakaoMessages.push({sender: 'me', text: r, time: kkNextTime()});
                        if (viewing(KK_KEY)) {kkRefresh(true); sfx('receive');} else kkAway(r);
                        await sleep(260);
                    }
                    kkSt.i++;
                    await sleep(500);
                } finally {
                    kkSt.typing = false; kkSt.busy = false;
                }
                if (viewing(KK_KEY) && !KK_SCRIPT[kkSt.i]) setTimeout(kbClose, 400);   // จบบทแล้ว → เก็บแป้น
            }

            function attachKk() {
                const scr = $('.ios-app.kk-room'), area = $('#kk-area');
                const field = scr && $('.kk-field input', scr);
                if (!scr || !area || !field) {cur = null; return;}
                field.readOnly = true; field.setAttribute('inputmode', 'none'); field.setAttribute('autocomplete', 'off');
                scr.classList.remove('kb-on', 'has-text');
                scr.style.setProperty('--trayh', '0px');
                const kb = document.createElement('div'); kb.className = 'ikb ' + uiLang();
                scr.appendChild(kb);
                cur = {key: KK_KEY, kk: true, scr, area, field, kb, tray: document.createElement('div'), lang: uiLang(), layer: 'base'};
                kbRender(cur.lang, 'base');
                kb.addEventListener('click', () => {kkRun();});        // แตะตรงไหนบนแป้น = เริ่มพิมพ์ข้อความที่กำหนด
                $('.kk-field', scr).addEventListener('click', kbOpen);
                area.addEventListener('click', kbClose);
                area.innerHTML = kkBubblesHtml(); scrollEnd();             // วาดใหม่ให้เลข 1 ที่ค้างอยู่แสดงตอนกลับเข้าห้อง
                if (kkSt.typing) addTyping();                              // กลับเข้าห้องตอนริคุกำลังพิมพ์อยู่
            }
            window.__kkAttach = attachKk;

            /* ให้ฝั่งสตอรี่ตั้งโหนดบทสนทนา / ส่งข้อความริคุเข้าห้องที่เปิดอยู่ */
            window.__igSetNode = function (node) {
                const key = 'ig_riku';
                state[key] = state[key] || {node: null, busy: false};
                state[key].node = node;
                if (viewing(key) && cur.scr.classList.contains('kb-on') && !state[key].busy) showChoices();
            };
            window.__igAppend = function () {
                if (!viewing('ig_riku')) return false;
                igRefresh(true); scrollEnd(); sfx('receive');
                return true;
            };
            const _igOpen = window.openInstagramChat;
            window.openInstagramChat = function (id) {
                const r = _igOpen.apply(this, arguments);
                if (id === 'riku_new') attachIg(); else if (cur && cur.ig) cur = null;
                return r;
            };

            const _open = window.openChatDetail;
            window.openChatDetail = function (key) {
                _open.apply(this, arguments);
                if (CHAT_SCRIPTS[key]) attach(key); else cur = null;
            };
            const _close = window.closeChatDetail;
            window.closeChatDetail = function () {
                const s = $('#chat-detail-screen');
                if (s) s.classList.remove('kb-on');
                if (_close) _close.apply(this, arguments);
            };
        })();

                        o.forEach(os => os.stop(t0 + 72));
                        ring = {g, o};
                    } catch (e) { }
                },
                ringStop: () => {stopTone(); if (ctx) stopRing();},
                ringtone: () => {                              // เสียงเรียกเข้า: ระฆังไล่โน้ตขึ้น-ลง วนทุก ~3.4 วิ จนกว่าจะรับ/ปฏิเสธ/ไม่ได้รับ
                    if (!enabled) return;
                    try {ensure();} catch (e) {return;}
                    stopTone();
                    const burst = () => play(t => {
                        [659.3, 784, 987.8, 1318.5, 987.8, 784].forEach((f, i) => bell(f, t + i * 0.13, 0.5, 0.15, true));
                        [659.3, 784, 987.8, 1318.5, 1568].forEach((f, i) => bell(f, t + 1.0 + i * 0.13, 0.55, 0.15, true));
                    });
                    burst();
                    toneT = setInterval(burst, 3400);
                },
                connect: () => play(t => {                     // อีกฝ่ายรับสาย: คลิกสั้น ๆ
                    tone(1100, t, 0.05, {gain: 0.07, attack: 0.002});
                    noise(t, 0.03, {f0: 2500, f1: 1500, q: 2, gain: 0.08, attack: 0.002});
                }),
                busy: () => play(t => {                        // สายไม่ว่าง: 480+620Hz ติด 0.5 / ดับ 0.5
                    for (let i = 0; i < 4; i++) hold([480, 620], t + 0.05 + i * 1.0, 0.5, 0.06);
                }),
                failed: () => play(t => {                      // ไม่มีผู้รับสาย / โทรไม่ติด: 3 โทนไล่ขึ้นแบบสัญญาณระบบ
                    hold([913], t + 0.05, 0.27, 0.07);
                    hold([1371], t + 0.34, 0.27, 0.07);
                    hold([1777], t + 0.63, 0.4, 0.07);
                }),
                hangup: () => play(t => {                      // วางสาย: บี๊บสั้น 3 ครั้ง
                    for (let i = 0; i < 3; i++) hold([480], t + i * 0.2, 0.1, 0.075);
                }),
                dtmf: k => play(t => {                         // กดแป้นเลขระหว่างสาย
                    const f = DTMF[k]; if (f) hold(f, t, 0.14, 0.06);
                }),
                toggle: () => play(t => {                      // ปิดเสียง / ลำโพง
                    tone(1500, t, 0.03, {gain: 0.07, attack: 0.002});
                    noise(t, 0.02, {f0: 3000, f1: 2000, q: 2, gain: 0.07, attack: 0.002});
                })
            };
            window.SFX = SFX;

            /* ---------- ปลดล็อกเสียง (เบราว์เซอร์ต้องมีการแตะก่อน) ---------- */
            const unlock = () => {if (enabled) {try {ensure();} catch (e) { } } };
            ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev =>
                document.addEventListener(ev, unlock, {capture: true, passive: true}));

            /* ---------- เสียงแตะทั่วไป (ถูกยกเลิกอัตโนมัติถ้าหน้านั้นมีเสียงเปลี่ยนหน้าเอง) ---------- */
            document.addEventListener('click', e => {
                const t = e.target;
                if (!t || !t.closest) return;
                if (t.closest('.key')) {SFX.digit(); return;}
                if (t.closest('.ikb, .home-indicator-container, .call-screen')) return;
                if (t.closest('button, [onclick], .app, .row, .kb-choice, .cd-field, .chat-item')) {
                    clearTimeout(tapT); tapT = setTimeout(() => SFX.tap(), 0);
                }
            }, true);

            /* ---------- hook เปลี่ยนหน้าจอหลัก ---------- */
            const activeId = () => {const s = document.querySelector('.screen.active'); return s ? s.id : '';};
            const _show = window.showScreen;
            if (typeof _show === 'function') {
                window.showScreen = function (id) {
                    const prev = activeId();
                    const r = _show.apply(this, arguments);
                    if (prev !== id) {
                        if (prev === 'lock-screen' && id === 'passcode-screen') SFX.swipe();
                        else if (prev === 'passcode-screen' && id === 'home-screen') SFX.unlock();
                        else if (id === 'home-screen' || id === 'lock-screen' || id === 'passcode-screen') SFX.close();
                        else SFX.open();
                    }
                    return r;
                };
            }

            const _vp = window.verifyPasscode;
            if (typeof _vp === 'function') {
                window.verifyPasscode = function () {
                    const r = _vp.apply(this, arguments);
                    const pc = document.getElementById('passcode-screen');
                    if (pc && pc.classList.contains('active')) SFX.wrong();   // รหัสผิด
                    return r;
                };
            }

            /* ---------- hook เปิด/ปิดหน้าย่อยในแอป ---------- */
            const wrap = (name, fn) => {
                const o = window[name];
                if (typeof o !== 'function') return;
                window[name] = function () {fn(); return o.apply(this, arguments);};
            };
            ['openChatDetail', 'openKakaoChat', 'openNoteDetail', 'openPhotoViewer'].forEach(n => wrap(n, () => SFX.open()));
            ['closeChatDetail', 'closeNoteDetail', 'closePhotoViewer'].forEach(n => wrap(n, () => SFX.close()));
        })();

        /* =====================================================
           BANNER แจ้งเตือนข้อความใหม่ — เด้งจากด้านบนทุกหน้าจอ (รวมหน้าล็อก)
           แตะ = เข้าห้องแชท | ปัดขึ้น = ปิด | หายเองใน 4.5 วิ
           ===================================================== */
        (function () {
            'use strict';
            let el = null, timer = 0;
            const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

            function build() {
                el = document.createElement('div');
                el.className = 'msg-banner';
                (document.querySelector('.phone') || document.body).appendChild(el);
                let y0 = null;
                el.addEventListener('pointerdown', e => {y0 = e.clientY; try {el.setPointerCapture(e.pointerId);} catch (_) { } });   /* ลากพ้นกรอบแบนเนอร์ก็ยังนับ (เมาส์) */
                el.addEventListener('pointerup', e => {
                    const dy = y0 === null ? 0 : e.clientY - y0; y0 = null;
                    if (dy < -16) hide();
                    else {const k = el.dataset.key; hide(); open(k);}
                });
                el.addEventListener('pointercancel', () => {y0 = null;});
            }
            function hide() {clearTimeout(timer); if (el) el.classList.remove('show');}
            function open(key) {
                try {window.openApp('messages', 'Messages'); window.openChatDetail(key);} catch (e) { }
            }

            window.showMsgBanner = function (key) {
                const c = (typeof chatDataMessages !== 'undefined') ? chatDataMessages[key] : null;
                if (!c) return;
                if (!el) build();
                const was = el.classList.contains('show');
                el.dataset.key = key;
                const html = '<img class=\"av\" src=\"' + esc(c.avatar) + '\" alt=\"\" decoding=\"sync\">' +
                    '<div class=\"tx\"><div class=\"t1\"><span>' + esc(c.name) + '</span><small>ตอนนี้</small></div>' +
                    '<div class=\"t2\">' + esc(c.preview) + '</div></div>';
                /* เนื้อหาเดิมเป๊ะ → ไม่แตะ DOM (กันรูปโปรไฟล์วาบตอนแจ้งเตือนซ้ำ) */
                if (el.dataset.html !== html) {el.innerHTML = html; el.dataset.html = html;}
                el.classList.remove('bump');
                const go = () => requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.classList.add('show'); if (was) el.classList.add('bump');
                }));
                /* รอรูปถอดรหัสเสร็จก่อนค่อยเลื่อนลงมา ไม่ให้รูปโผล่ทีหลังแล้วกะพริบ */
                const img = el.querySelector('img.av');
                if (img && img.decode) img.decode().then(go, go); else go();
                clearTimeout(timer);
                timer = setTimeout(hide, 4500);
            };
            /* เข้าห้องแชทด้วยวิธีอื่นแล้ว → เก็บแบนเนอร์ */
            const _o = window.openChatDetail;
            if (typeof _o === 'function') window.openChatDetail = function () {hide(); return _o.apply(this, arguments);};

            /* ---- KakaoTalk: ริคุตอบตอนเราไม่ได้อยู่ในห้อง → แบนเนอร์ลอย (แตะ = เข้าห้อง "เจ้าหญิง") ---- */
            let kel = null, ktimer = 0;
            function kHide() {clearTimeout(ktimer); if (kel) kel.classList.remove('show');}
            function kBuild() {
                kel = document.createElement('div');
                kel.className = 'msg-banner ig-banner kk-banner';
                (document.querySelector('.phone') || document.body).appendChild(kel);
                let y0 = null;
                kel.addEventListener('pointerdown', e => {y0 = e.clientY; try {kel.setPointerCapture(e.pointerId);} catch (_) { } });
                kel.addEventListener('pointerup', e => {
                    const dy = y0 === null ? 0 : e.clientY - y0; y0 = null;
                    if (dy < -16) {kHide(); return;}
                    kHide();
                    try {window.openApp('kakaotalk', 'KakaoTalk'); window.openKakaoChat('sion_kakao');} catch (_) { }
                });
                kel.addEventListener('pointercancel', () => {y0 = null;});
            }
            window.showKkBanner = function (name, text) {
                if (!kel) kBuild();
                const was = kel.classList.contains('show');
                const html = '<span class="avw"><img class="av" src="riku-10.jpg" alt="" decoding="sync"><img class="ai" src="KakaoTalk_logo.svg" alt="" decoding="sync"></span>' +
                    '<div class="tx"><div class="t1"><span>' + esc(name) + '</span><small>ตอนนี้</small></div>' +
                    '<div class="t2">' + esc(text) + '</div></div>';
                if (kel.dataset.html !== html) {kel.innerHTML = html; kel.dataset.html = html;}
                kel.classList.remove('bump');
                requestAnimationFrame(() => requestAnimationFrame(() => {kel.classList.add('show'); if (was) kel.classList.add('bump');}));
                clearTimeout(ktimer); ktimer = setTimeout(kHide, 4500);
            };
            const _k = window.openKakaoChat;
            if (typeof _k === 'function') window.openKakaoChat = function () {kHide(); return _k.apply(this, arguments);};
        })();
    </script>

        (function () {
            var W = 340, H = 700, PAD = 28, baseW = 0, baseH = 0;
            function typing() {var a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);}
            function fit() {
                var vv = window.visualViewport;
                var vw = (vv && vv.width) || window.innerWidth, vh = (vv && vv.height) || window.innerHeight;
                /* on-screen keyboard shrinks the viewport: keep the last keyboard-free size so the phone never shrinks */
                if (typing() && baseW && Math.abs(vw - baseW) < 2 && vh < baseH) vh = baseH; else {baseW = vw; baseH = vh;}
                var k = Math.min(1, (vw - PAD) / W, (vh - PAD) / H);
                if (!(k > 0.3)) k = 0.3;
                document.documentElement.style.setProperty('--fit', k >= 0.999 ? '1' : k.toFixed(4));
                document.documentElement.style.setProperty('--lockH', vh + 'px');
            }
            window.__fit = fit;
            fit();
            window.addEventListener('resize', fit);
            window.addEventListener('orientationchange', function () {baseW = baseH = 0; setTimeout(fit, 250);});
            document.addEventListener('focusout', function () {setTimeout(fit, 350);});
            if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
        })();

    <script id="lock-notif-js">
        (function () {
            'use strict';
            const ICON = {messages: I27.messages, kakaotalk: I27.kakaotalk, instagram: 'icon-ig.png', phone: I27.phone};
            const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
            const items = [];                 /* หนึ่งแอป = หนึ่งการ์ด (ข้อความล่าสุด + จำนวนที่ยังไม่อ่าน) ใหม่สุดอยู่บน */
            let stack = null, pending = null;

            function host() {
                if (stack && stack.isConnected) return stack;
                const ls = document.getElementById('lock-screen'); if (!ls) return null;
                stack = document.createElement('div'); stack.className = 'ln-stack';
                const bottom = ls.querySelector('.lock-bottom');
                ls.insertBefore(stack, bottom);
                stack.addEventListener('click', e => {
                    const c = e.target.closest('.ln-card'); if (!c) return;
                    pending = c.dataset.app;
                    window.showScreen('passcode-screen');
                });
                return stack;
            }
            function render(hot) {
                const h = host(); if (!h) return;
                h.innerHTML = items.map(it => {
                    const ico = ICON[it.app];
                    const av = it.av
                        ? '<img class="a" src="' + esc(it.av) + '" alt="" decoding="sync"><img class="i" src="' + ico + '" alt="">'
                        : '<img class="a ico" src="' + ico + '" alt="">';
                    return '<div class="ln-card' + (it.n > 1 ? ' multi' : '') + (it.app === hot ? ' new' : '') + '" data-app="' + it.app + '">' +
                        '<span class="ln-av">' + av + '<b class="ln-bd">' + it.n + '</b></span>' +
                        '<div class="ln-tx"><div class="ln-t1"><span>' + esc(it.name) + '</span><small>' + esc(it.time) + '</small></div>' +
                        '<div class="ln-t2">' + esc(it.text) + '</div></div></div>';
                }).join('');
            }
            window.lockNotifAdd = function (o) {
                const i = items.findIndex(x => x.app === o.app);
                const n = i >= 0 ? items[i].n + (o.n || 1) : (o.n || 1);
                if (i >= 0) items.splice(i, 1);
                items.unshift({app: o.app, name: o.name, text: o.text, av: o.av || '', time: o.time || 'ตอนนี้', n: n});
                render(o.app);
            };

            /* ทุกจุดที่แอปเดิมเด้งแบนเนอร์ → จดเข้าหน้าจอล็อกด้วย */
            const wrapFn = (name, fn) => {
                const o = window[name]; if (typeof o !== 'function') return;
                window[name] = function () {try {fn.apply(this, arguments);} catch (e) { } return o.apply(this, arguments);};
            };
            wrapFn('showMsgBanner', key => {
                const c = chatDataMessages[key]; if (!c) return;
                window.lockNotifAdd({app: 'messages', name: c.name, text: c.preview, av: c.avatar});
            });
            wrapFn('showKkBanner', (name, text) => window.lockNotifAdd({app: 'kakaotalk', name: name, text: text, av: 'riku-10.jpg'}));

            /* ปลดล็อกแล้ว = เห็นแล้ว ล้างการ์ด; แตะการ์ดมา → ปลดล็อกเสร็จเปิดแอปนั้นให้เลย */
            const OPEN = {
                messages: () => {window.openApp('messages', 'Messages'); window.openChatDetail('riku_new');},
                kakaotalk: () => {window.openApp('kakaotalk', 'KakaoTalk'); window.openKakaoChat('sion_kakao');},
                instagram: () => {window.openApp('instagram', 'Instagram');},
                phone: () => {window.openApp('phone', 'Phone');}
            };
            const _show = window.showScreen;
            window.showScreen = function (id) {
                const prev = document.querySelector('.screen.active');
                const r = _show.apply(this, arguments);
                if (id === 'home-screen' && prev && prev.id === 'passcode-screen') {
                    const p = pending; pending = null;
                    setTimeout(() => {items.length = 0; render();}, 700);
                    if (p && OPEN[p]) setTimeout(() => {try {OPEN[p]();} catch (e) { } }, 450);
                } else if (id === 'lock-screen') pending = null;
                return r;
            };

            /* เปิดแอปนั้นแล้ว = อ่านแล้ว → เอาการ์ดของแอปนั้นออก (ล็อกใหม่รอบหน้าจะไม่ขึ้นค้าง) */
            const _openApp2 = window.openApp;
            if (typeof _openApp2 === 'function') window.openApp = function (id) {
                const k = items.findIndex(x => x.app === id);
                if (k >= 0) {items.splice(k, 1); render();}
                return _openApp2.apply(this, arguments);
            };
        })();
    </script>

            /* ระยะที่ .phone ถูกยกอยู่จริงในเฟรมนี้ (อ่านจากตำแหน่งจริง ไม่ใช่ค่าเป้าหมาย) */
